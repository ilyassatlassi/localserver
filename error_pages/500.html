<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
        }
        .code { font-size: 6rem; font-weight: 800; color: #ee5a24; line-height: 1; }
        .title { font-size: 1.5rem; margin: 1rem 0 0.5rem; color: #f0826d; }
        .message { font-size: 0.95rem; color: #aaa; line-height: 1.6; }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        a { color: #7c83ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <div class="code">500</div>
        <div class="title">Internal Server Error</div>
        <p class="message">Something went wrong on our end. Our team has been notified. Please try again later.</p>
        <p style="margin-top: 1.5rem;"><a href="/">← Back to Home</a></p>
    </div>
</body>
</html>
