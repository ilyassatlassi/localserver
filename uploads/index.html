<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uploads</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        margin: 32px;
        line-height: 1.5;
        color: #1b1b1b;
        background: #f7f4ef;
      }
      .card {
        max-width: 720px;
        background: #fffdfa;
        padding: 24px;
        border: 2px solid #2a2a2a;
        box-shadow: 6px 6px 0 #2a2a2a;
      }
      h1 {
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 16px;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #2a2a2a;
        font-size: 14px;
      }
      button {
        margin-top: 12px;
        padding: 8px 14px;
        border: 2px solid #2a2a2a;
        background: #f6c453;
        cursor: pointer;
        font-weight: 600;
      }
      .status {
        margin-top: 12px;
        font-size: 14px;
      }
      code {
        background: #f0efe9;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Upload a File</h1>
      <p>
        This server accepts raw file uploads at
        <code>/uploads/your-file-name.ext</code>.
      </p>

      <label>
        Choose a file
        <input id="fileInput" type="file" />
      </label>

      <label>
        Save as (optional)
        <input id="fileName" type="text" placeholder="example.txt" />
      </label>

      <button id="uploadBtn" type="button">Upload</button>

      <div id="status" class="status"></div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const fileName = document.getElementById("fileName");
      const status = document.getElementById("status");

      let MAX_BYTES = 10485760; // fallback until we fetch the real value

      async function loadMaxBytes() {
        try {
          const res = await fetch("/uploads/limit");
          if (!res.ok) return;
          const data = await res.json();
          if (typeof data.maxBytes === "number") {
            MAX_BYTES = data.maxBytes;
          }
        } catch (e) {
          // keep fallback if request fails
        }
      }

      loadMaxBytes();

      document.getElementById("uploadBtn").addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file) {
          status.textContent = "Please choose a file first.";
          return;
        }

        if (file.size > MAX_BYTES) {
          window.location.href = "/error_pages/413.html";
          return;
        }

        const name = fileName.value.trim() || file.name;
        const url = "/uploads/" + encodeURIComponent(name);

        status.textContent = "Uploading...";

        try {
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": file.type || "application/octet-stream"
            },
            body: file
          });
          if (res.status === 413) {
            window.location.href = "/error_pages/413.html";
            return;
          }
          const text = await res.text();
          status.textContent = "Status: " + res.status + " " + text;
        } catch (err) {
          status.textContent = "Upload failed: " + err;
        }
      });
    </script>
  </body>
</html>
